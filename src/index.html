<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua AI - Interface Futurista</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #030712;
            color: #e0f2fe;
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15), transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.08), transparent 50%);
        }

        /* Barra Lateral (Sidebar) */
        sidebar {
            width: 260px;
            background: rgba(10, 15, 30, 0.8);
            border-right: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
        }

        .brand-sidebar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .logo-orb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            box-shadow: 0 0 10px #06b6d4;
        }

        .brand-sidebar h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .chat-item:hover {
            background: rgba(30, 41, 59, 0.5);
            color: #e0f2fe;
        }

        .chat-item.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.3);
            color: #38bdf8;
        }

        /* Área Principal do Chat */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 1.5rem;
            gap: 1rem;
            max-width: calc(100vw - 260px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
        }

        .system-status {
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #34d399;
            box-shadow: 0 0 6px #34d399;
        }

        .chat-container {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .message.system {
            align-self: center;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.aqua {
            align-self: flex-start;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #e0f2fe;
            border-bottom-left-radius: 2px;
        }

        .input-panel {
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 1rem;
            padding: 8px;
        }

        input[type="text"]::placeholder {
            color: #475569;
        }

        button.send-btn {
            background: linear-gradient(135deg, #06b6d4, #2563eb);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.send-btn:hover {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
        }
    </style>
</head>
<body>

    <!-- BARRA LATERAL -->
    <sidebar>
        <div class="brand-sidebar">
            <div class="logo-orb"></div>
            <h1>AQUA AI</h1>
        </div>
        <button class="new-chat-btn" onclick="createNewChat()">+ Novo Chat</button>
        <div class="chat-list" id="chat-list">
            <!-- Os chats salvos aparecem aqui -->
        </div>
    </sidebar>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <header>
            <span style="font-weight: 600; font-size: 0.95rem; color: #38bdf8;" id="current-chat-title">Selecione um chat</span>
            <div class="system-status">
                <div class="status-dot"></div>
                <span id="status-text">Carregando GGUF...</span>
            </div>
        </header>

        <div class="chat-container" id="chat">
            <div class="message system" id="loading-msg">
                Carregando o modelo GGUF no Electron... Aguarde um instante.
            </div>
        </div>

        <div class="input-panel">
            <input type="text" id="user-input" placeholder="Digite sua mensagem..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">ENVIAR</button>
        </div>
    </main>

    <script>
        const { ipcRenderer } = require('electron');
        let currentChatId = null;
        let chatsData = {};

        // Quando o modelo carregar, busca os chats salvos no database.json
        ipcRenderer.on('system-ready', async (event, message) => {
            const loadingMsg = document.getElementById('loading-msg');
            if (loadingMsg) {
                loadingMsg.innerText = message;
                setTimeout(() => {
                    loadingMsg.style.opacity = '0';
                    setTimeout(() => loadingMsg.remove(), 500);
                }, 1000);
            }
            document.getElementById('status-text').innerText = "Pronto";
            
            // Carrega os chats salvos anteriormente
            chatsData = await ipcRenderer.invoke('carregar-chats');
            renderChatList();

            // Se houver chats salvos, abre o primeiro; senão, cria um novo
            const chatIds = Object.keys(chatsData);
            if (chatIds.length > 0) {
                switchChat(chatIds[chatIds.length - 1]);
            } else {
                await createNewChat();
            }
        });

        async function createNewChat() {
            const chatId = await ipcRenderer.invoke('criar-novo-chat');
            if (!chatId) return;

            chatsData = await ipcRenderer.invoke('carregar-chats');
            renderChatList();
            switchChat(chatId);
        }

        function renderChatList() {
            const listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';

            for (const id in chatsData) {
                const item = document.createElement('div');
                item.className = 'chat-item ' + (id === currentChatId ? 'active' : '');
                item.innerText = chatsData[id].title;
                item.onclick = () => switchChat(id);
                listEl.appendChild(item);
            }
        }

        function switchChat(chatId) {
            currentChatId = chatId;
            if (!chatsData[chatId]) return;

            document.getElementById('current-chat-title').innerText = chatsData[chatId].title;
            
            const chatContainer = document.getElementById('chat');
            chatContainer.innerHTML = '';
            
            // Redesenha as mensagens guardadas no banco
            chatsData[chatId].messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message ' + msg.sender;
                msgDiv.innerText = msg.text;
                chatContainer.appendChild(msgDiv);
            });

            renderChatList();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            // Adiciona na tela do usuário
            appendUIMessage('user', text);
            input.value = '';

            // Atualiza localmente no array para feedback imediato
            chatsData[currentChatId].messages.push({ sender: 'user', text: text });
            if (chatsData[currentChatId].messages.length <= 2) {
                chatsData[currentChatId].title = text.length > 20 ? text.substring(0, 20) + '...' : text;
                renderChatList();
                document.getElementById('current-chat-title').innerText = chatsData[currentChatId].title;
            }

            const responseMsgId = 'resp-' + Date.now();
            appendUIMessage('aqua', 'Pensando...', responseMsgId);

            try {
                const resposta = await ipcRenderer.invoke('perguntar-ia', { chatId: currentChatId, mensagem: text });
                
                chatsData[currentChatId].messages.push({ sender: 'aqua', text: resposta });
                document.getElementById(responseMsgId).innerText = resposta;
            } catch (err) {
                document.getElementById(responseMsgId).innerText = 'Erro ao processar a resposta da IA.';
                console.error(err);
            }
        }

        function appendUIMessage(sender, text, customId = null) {
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = 'message ' + sender;
            if (customId) msg.id = customId;
            msg.innerText = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
