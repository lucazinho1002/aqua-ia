<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua AI - Interface Futurista</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #030712;
            color: #e0f2fe;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15), transparent 70%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.08), transparent 50%);
        }

        header {
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-orb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            box-shadow: 0 0 15px #06b6d4, 0 0 30px #3b82f6;
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 10px #06b6d4; }
            100% { transform: scale(1.1); box-shadow: 0 0 25px #06b6d4, 0 0 40px #3b82f6; }
        }

        .brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #34d399;
            box-shadow: 0 0 8px #34d399;
        }

        main {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .config-panel {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.05);
        }

        .info-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
        }

        .info-value {
            font-size: 0.95rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .chat-container {
            flex: 1;
            min-height: 400px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.system {
            align-self: center;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .message.aqua {
            align-self: flex-start;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #e0f2fe;
            border-bottom-left-radius: 2px;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.15);
        }

        .input-panel {
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 8px 12px;
            border-radius: 12px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 1rem;
            padding: 8px;
        }

        input[type="text"]::placeholder {
            color: #475569;
        }

        button {
            background: linear-gradient(135deg, #06b6d4, #2563eb);
            border: none;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo-orb"></div>
            <h1 id="ia-title">AQUA AI</h1>
        </div>
        <div class="system-status">
            <span>VERSÃO: <strong id="ia-version" style="color: #38bdf8;">--</strong></span>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>SISTEMA ATIVO</span>
            </div>
        </div>
    </header>

    <main>
        <div class="config-panel">
            <div class="info-block">
                <span class="info-label">Vocabulário:</span>
                <span class="info-value" id="cfg-vocab">Carregando...</span>
            </div>
            <div class="info-block">
                <span class="info-label">Geração:</span>
                <span class="info-value" id="cfg-gen">Carregando...</span>
            </div>
            <div class="info-block">
                <span class="info-label">Interface (UI):</span>
                <span class="info-value" id="cfg-ui">Carregando...</span>
            </div>
            <div class="info-block">
                <span class="info-label">Electron:</span>
                <span class="info-value" id="cfg-electron">Carregando...</span>
            </div>
        </div>

        <div class="chat-container" id="chat">
            <div class="message system">
                Lendo config.json para descobrir os caminhos dos arquivos...
            </div>
        </div>

        <div class="input-panel">
            <input type="text" id="user-input" placeholder="Digite uma palavra ou comando (ex: Oi)..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">ENVIAR</button>
        </div>
    </main>

    <footer>
        Aqua AI System &copy; 2026 - Interface Futurista Ativa
    </footer>

    <script>
        let configData = null;
        let vocabData = null;
        let genData = null;

        async function loadSystem() {
            try {
                // 1. Lê o config.json que está na mesma pasta (src/config.json)
                const resConfig = await fetch('config.json');
                if (!resConfig.ok) throw new Error('Não foi possível carregar o config.json');
                configData = await resConfig.json();

                // Atualiza os dados visuais da interface com base no config
                document.getElementById('ia-title').innerText = (configData.ia?.name || 'AQUA').toUpperCase() + ' AI';
                document.getElementById('ia-version').innerText = configData.ia?.version || '0.1';
                
                const vocabPath = configData.itens?.vocabulary;
                const genPath = configData.itens?.generation;
                const uiPath = configData.itens?.ui;
                const electronStatus = configData.itens?.['electron?'];

                document.getElementById('cfg-vocab').innerText = vocabPath || 'Não definido';
                document.getElementById('cfg-gen').innerText = genPath || 'Não definido';
                document.getElementById('cfg-ui').innerText = uiPath || 'Não definido';
                document.getElementById('cfg-electron').innerText = electronStatus || 'no';

                // 2. Lê dinamicamente o arquivo de vocabulário usando o caminho exato do config.json
                if (vocabPath) {
                    // Como o index.html está em src/, se o config.json indicar "src/vocab.json", 
                    // ajustamos para buscar corretamente dentro do contexto do electron/servidor
                    const cleanVocabPath = vocabPath.startsWith('src/') ? vocabPath.replace('src/', '') : vocabPath;
                    const resVocab = await fetch(cleanVocabPath);
                    if (resVocab.ok) {
                        vocabData = await resVocab.json();
                    } else {
                        console.warn("Não foi possível carregar o vocabulário em:", cleanVocabPath);
                    }
                }

                // 3. Lê dinamicamente o arquivo de geração usando o caminho exato do config.json
                if (genPath) {
                    const cleanGenPath = genPath.startsWith('src/') ? genPath.replace('src/', '') : genPath;
                    const resGen = await fetch(cleanGenPath);
                    if (resGen.ok) {
                        genData = await resGen.json();
                    } else {
                        console.warn("Não foi possível carregar a geração em:", cleanGenPath);
                    }
                }

                appendMessage('system', 'Arquivos carregados com sucesso com base nas diretrizes do config.json!');
                appendMessage('aqua', 'Olá! Como posso te ajudar hoje?');

            } catch (err) {
                console.error(err);
                appendMessage('system', 'Erro crítico ao carregar os arquivos a partir do config.json.');
            }
        }

        function appendMessage(sender, text) {
            const chat = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = 'message ' + sender;
            msg.innerText = text;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            setTimeout(() => {
                let responseGenerated = false;

                if (genData && genData.generation && genData.generation.normal) {
                    const normalMap = genData.generation.normal;
                    
                    if (normalMap[text]) {
                        const pattern = normalMap[text];
                        const assembledResponse = decodeTokenPattern(pattern);
                        appendMessage('aqua', assembledResponse);
                        responseGenerated = true;
                    }
                }

                if (!responseGenerated) {
                    appendMessage('aqua', 'Processado: "' + text + '". (Nenhum padrão cadastrado no generation.json para essa entrada)');
                }
            }, 400);
        }

        function decodeTokenPattern(pattern) {
            if (!vocabData || !vocabData.vocab) return pattern;

            const tokens = pattern.split('+');
            let output = '';

            tokens.forEach(token => {
                const cleanToken = token.trim();
                if (vocabData.vocab[cleanToken] !== undefined) {
                    output += vocabData.vocab[cleanToken];
                } else {
                    output += cleanToken;
                }
            });

            return output;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        window.onload = loadSystem;
    </script>
</body>
</html>
